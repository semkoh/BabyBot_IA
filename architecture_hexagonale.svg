<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI', Tahoma, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#e2e8f0" font-size="28" font-weight="bold">Architecture Hexagonale — BabyCry AI</text>
  <text x="600" y="78" text-anchor="middle" fill="#94a3b8" font-size="14">Analyse des pleurs de bébé &amp; Assistant parental intelligent</text>

  <!-- Outer Hexagon (Infrastructure) -->
  <polygon points="600,105 900,270 900,600 600,765 300,600 300,270" 
           fill="url(#hexGrad)" stroke="#475569" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="600" y="130" text-anchor="middle" fill="#64748b" font-size="12" font-weight="bold" letter-spacing="3">INFRASTRUCTURE (ADAPTATEURS)</text>

  <!-- Inner Hexagon (Domain) -->
  <polygon points="600,230 770,325 770,515 600,610 430,515 430,325" 
           fill="url(#coreGrad)" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="260" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="bold" letter-spacing="2">DOMAINE MÉTIER</text>

  <!-- Core Domain Content -->
  <text x="600" y="340" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">Entités</text>
  <text x="600" y="365" text-anchor="middle" fill="#cbd5e1" font-size="11">AudioSample · CryPrediction</text>
  <text x="600" y="383" text-anchor="middle" fill="#cbd5e1" font-size="11">ChatMessage · Feedback · Parent</text>
  
  <line x1="520" y1="400" x2="680" y2="400" stroke="#475569" stroke-width="1"/>
  
  <text x="600" y="425" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">Use Cases</text>
  <text x="600" y="450" text-anchor="middle" fill="#cbd5e1" font-size="11">AnalyzeCry · AskChatbot</text>
  <text x="600" y="468" text-anchor="middle" fill="#cbd5e1" font-size="11">SubmitFeedback · FinetuneModel</text>
  
  <line x1="520" y1="485" x2="680" y2="485" stroke="#475569" stroke-width="1"/>
  
  <text x="600" y="510" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">Objets Valeur</text>
  <text x="600" y="535" text-anchor="middle" fill="#cbd5e1" font-size="11">MFCCFeatures · TrainingMetrics</text>
  <text x="600" y="553" text-anchor="middle" fill="#cbd5e1" font-size="11">CryType · FeedbackType</text>

  <!-- ═══ DRIVING PORTS (Left) ═══ -->
  
  <!-- Port: API REST -->
  <rect x="70" y="240" width="180" height="80" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="268" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="bold">🌐 API REST</text>
  <text x="160" y="288" text-anchor="middle" fill="#94a3b8" font-size="10">FastAPI</text>
  <text x="160" y="305" text-anchor="middle" fill="#64748b" font-size="9">/api/analyze · /api/chat</text>
  <line x1="250" y1="280" x2="430" y2="340" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Port: WebSocket -->
  <rect x="70" y="350" width="180" height="80" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="378" text-anchor="middle" fill="#06b6d4" font-size="11" font-weight="bold">🔌 WebSocket</text>
  <text x="160" y="398" text-anchor="middle" fill="#94a3b8" font-size="10">Temps réel</text>
  <text x="160" y="415" text-anchor="middle" fill="#64748b" font-size="9">Notifications parent</text>
  <line x1="250" y1="390" x2="430" y2="420" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- Port: Micro Audio -->
  <rect x="70" y="460" width="180" height="80" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="488" text-anchor="middle" fill="#10b981" font-size="11" font-weight="bold">🎤 Micro Audio</text>
  <text x="160" y="508" text-anchor="middle" fill="#94a3b8" font-size="10">Flux audio continu</text>
  <text x="160" y="525" text-anchor="middle" fill="#64748b" font-size="9">Capteur son bébé</text>
  <line x1="250" y1="500" x2="430" y2="480" stroke="#10b981" stroke-width="1.5"/>

  <!-- ═══ DRIVEN PORTS (Right) ═══ -->

  <!-- Adapter: LLM -->
  <rect x="950" y="180" width="180" height="90" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="208" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="bold">🧠 LLM Adapter</text>
  <text x="1040" y="228" text-anchor="middle" fill="#94a3b8" font-size="10">Mistral-7B-Instruct</text>
  <text x="1040" y="245" text-anchor="middle" fill="#64748b" font-size="9">+ LoRA Finetuning</text>
  <text x="1040" y="258" text-anchor="middle" fill="#64748b" font-size="9">Génération conseil &amp; chat</text>
  <line x1="770" y1="360" x2="950" y2="240" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Adapter: Classifier -->
  <rect x="950" y="290" width="180" height="90" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="318" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="bold">🔍 Classificateur</text>
  <text x="1040" y="338" text-anchor="middle" fill="#94a3b8" font-size="10">SVM + Random Forest</text>
  <text x="1040" y="355" text-anchor="middle" fill="#64748b" font-size="9">MFCC Features</text>
  <text x="1040" y="368" text-anchor="middle" fill="#64748b" font-size="9">5 classes de pleurs</text>
  <line x1="770" y1="400" x2="950" y2="340" stroke="#ef4444" stroke-width="1.5"/>

  <!-- Adapter: Knowledge Base -->
  <rect x="950" y="400" width="180" height="90" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="428" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="bold">📚 Base Connaissances</text>
  <text x="1040" y="448" text-anchor="middle" fill="#94a3b8" font-size="10">ChromaDB + RAG</text>
  <text x="1040" y="465" text-anchor="middle" fill="#64748b" font-size="9">Sentence-Transformers</text>
  <text x="1040" y="478" text-anchor="middle" fill="#64748b" font-size="9">Santé · Éducation · Sommeil</text>
  <line x1="770" y1="460" x2="950" y2="440" stroke="#8b5cf6" stroke-width="1.5"/>

  <!-- Adapter: Database -->
  <rect x="950" y="510" width="180" height="90" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="538" text-anchor="middle" fill="#06b6d4" font-size="11" font-weight="bold">🗄️ Base de Données</text>
  <text x="1040" y="558" text-anchor="middle" fill="#94a3b8" font-size="10">SQLite + SQLAlchemy</text>
  <text x="1040" y="575" text-anchor="middle" fill="#64748b" font-size="9">Messages · Feedbacks</text>
  <text x="1040" y="588" text-anchor="middle" fill="#64748b" font-size="9">Prédictions · Parents</text>
  <line x1="770" y1="510" x2="950" y2="550" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- ═══ BOTTOM: Training Pipeline ═══ -->
  
  <rect x="330" y="690" width="540" height="100" rx="14" fill="#1e293b" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="718" text-anchor="middle" fill="#f97316" font-size="14" font-weight="bold">🔄 Pipeline d'Apprentissage Continu</text>
  
  <text x="405" y="745" text-anchor="middle" fill="#94a3b8" font-size="11">Feedbacks 👍👎</text>
  <text x="405" y="762" text-anchor="middle" fill="#64748b" font-size="9">Collecte parents</text>
  
  <text x="530" y="745" text-anchor="middle" fill="#94a3b8" font-size="10">→</text>
  
  <text x="600" y="745" text-anchor="middle" fill="#94a3b8" font-size="11">Dataset DPO</text>
  <text x="600" y="762" text-anchor="middle" fill="#64748b" font-size="9">Paires préférences</text>
  
  <text x="670" y="745" text-anchor="middle" fill="#94a3b8" font-size="10">→</text>
  
  <text x="780" y="745" text-anchor="middle" fill="#94a3b8" font-size="11">LoRA Finetuning</text>
  <text x="780" y="762" text-anchor="middle" fill="#64748b" font-size="9">r=16, α=32</text>

  <!-- Connection from pipeline to domain -->
  <line x1="600" y1="690" x2="600" y2="610" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6,3"/>
  
  <!-- Connection from pipeline to LLM -->
  <path d="M 870 740 Q 1040 740 1040 630" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Labels for port types -->
  <text x="160" y="220" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="bold" letter-spacing="1">PORTS D'ENTRÉE</text>
  <text x="160" y="235" text-anchor="middle" fill="#475569" font-size="9">(Driving / Primary)</text>
  
  <text x="1040" y="160" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="bold" letter-spacing="1">PORTS DE SORTIE</text>
  <text x="1040" y="175" text-anchor="middle" fill="#475569" font-size="9">(Driven / Secondary)</text>

  <!-- Audio Flow annotation -->
  <rect x="70" y="590" width="180" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" opacity="0.8"/>
  <text x="160" y="615" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold">Flux Audio</text>
  <text x="160" y="635" text-anchor="middle" fill="#64748b" font-size="9">Son → MFCC → Classe → Notif</text>

  <!-- Chatbot Flow annotation -->  
  <rect x="70" y="660" width="180" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" opacity="0.8"/>
  <text x="160" y="685" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold">Flux Chatbot</text>
  <text x="160" y="705" text-anchor="middle" fill="#64748b" font-size="9">Question → RAG → LLM → Réponse</text>

  <!-- Legend -->
  <rect x="40" y="780" width="1120" height="80" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="100" y="810" text-anchor="middle" fill="#64748b" font-size="11" font-weight="bold">LÉGENDE</text>
  <circle cx="180" cy="830" r="6" fill="#3b82f6"/><text x="200" y="835" fill="#94a3b8" font-size="10">Ports d'entrée (Driving)</text>
  <circle cx="380" cy="830" r="6" fill="#f59e0b"/><text x="400" y="835" fill="#94a3b8" font-size="10">Ports de sortie (Driven)</text>
  <circle cx="580" cy="830" r="6" fill="#7c3aed"/><text x="600" y="835" fill="#94a3b8" font-size="10">Domaine métier</text>
  <circle cx="760" cy="830" r="6" fill="#f97316"/><text x="780" y="835" fill="#94a3b8" font-size="10">Pipeline apprentissage</text>
  <line x1="930" y1="830" x2="960" y2="830" stroke="#475569" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="975" y="835" fill="#94a3b8" font-size="10">Flux asynchrone</text>
</svg>
